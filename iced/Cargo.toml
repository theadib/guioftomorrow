[package]
name = "iced_clock"
version = "0.1.0"
edition = "2021"
description = "GUI of Tomorrow — Iced (Rust) clock demonstrator"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dark-light = "3.0.0"
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time", "rt"] }
