[package]
name = "slint_clock"
version = "0.1.0"
edition = "2021"
description = "GUI of Tomorrow — Slint (Rust) clock demonstrator"
build = "build.rs"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.0"

[build-dependencies]
slint-build = "1.18.0"
